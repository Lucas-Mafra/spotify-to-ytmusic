[project]
name = "spotify2yt"
version = "2.0"
description = "CLI tool to migrate playlists between Spotify and YouTube Music"
requires-python = ">=3.10"
dependencies = [
    "browser-cookie3>=0.20.1",
    "pyfiglet==1.0.0",
    "python-dotenv==1.2.1",
    "rich==14.2.0",
    "spotipy==2.25.1",
    "tqdm==4.67.1",
    "typer==0.20.0",
    "ytmusicapi==1.11.1",
]

[dependency-groups]
dev = [
    "mypy==1.15.0",
    "pytest==8.3.5",
    "ruff==0.16.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "RUF"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

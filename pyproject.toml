[project]
name = "spotify2yt"
version = "3.0.0"
description = "CLI tool to migrate playlists between Spotify and YouTube Music"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-dotenv>=1.0",
    "rich>=13.7",
    "spotipy>=2.24",
    "typer>=0.12",
    "ytmusicapi>=1.7",
]

[project.scripts]
spotify2yt = "spotify2yt.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify2yt"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/spotify2yt/cli.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
pretty = true

[[tool.mypy.overrides]]
module = ["spotipy", "spotipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]